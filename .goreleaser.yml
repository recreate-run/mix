version: 2
project_name: mix
before:
  hooks:
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X mix/internal/version.Version={{.Version}}
    main: ./mix_agent/main.go
    dir: .

archives:
  - name_template: >-
      mix-mac-
      {{- if eq .Arch "amd64" }}intel
      {{- else if eq .Arch "arm64" }}apple-silicon
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"
