name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (patch/minor)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  actions: read

env:
  GO_VERSION: '1.24.0'

jobs:
  # Pre-release validation
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mix_agent/go.sum

      - name: Get version
        id: version
        run: |
          if [[ ${{ github.ref_type }} == 'tag' ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=snapshot-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Download Go modules
        run: cd mix_agent && go mod download

      - name: Test build
        run: |
          cd mix_agent
          echo "Testing Go build process..."
          go build -o /tmp/mix-test ./main.go
          echo "Build test successful!"
          rm -f /tmp/mix-test

  # macOS release build
  release:
    needs: validate
    runs-on: ubuntu-latest
    # Run on tags, manual dispatch, or pushes to main/dev for testing
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mix_agent/go.sum

      - name: Download Go modules
        run: cd mix_agent && go mod download

      - name: Check if this is a tagged release
        id: check_tag
        run: |
          if [[ ${{ github.ref_type }} == 'tag' ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "args=release --clean" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "args=build --snapshot --clean" >> $GITHUB_OUTPUT
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: ${{ steps.check_tag.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment when ready for package manager publishing
          # HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          # AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts-${{ needs.validate.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/mix_darwin_*/*
            dist/mix_linux_*/*
            dist/mix_windows_*/*
          retention-days: 30


  # Deploy to Railway Dev Environment (on push to dev branch)
  deploy-dev:
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway Dev
        run: railway up --service=${{ secrets.RAILWAY_DEV_SERVICE_ID }} --detach

  # Deploy to Railway Production Environment (only for tagged releases)
  deploy-production:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway Production
        run: railway up --service=${{ secrets.RAILWAY_SERVICE_ID }} --detach

  # Test cross-platform builds (for PRs and non-tag pushes)
  test-build:
    needs: validate
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'"
    strategy:
      matrix:
        include:
          # macOS builds
          - goos: darwin
            goarch: amd64
            name: mac-intel
          - goos: darwin
            goarch: arm64
            name: mac-apple-silicon
          # Linux builds
          - goos: linux
            goarch: amd64
            name: linux-x64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          # Windows builds
          - goos: windows
            goarch: amd64
            name: windows-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build for ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd mix_agent
          mkdir -p ../dist
          binary_name="mix-${{ matrix.name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi
          go build -ldflags "-s -w -X mix/internal/version.Version=test-${{ matrix.name }}" -o "../dist/${binary_name}" ./main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist/mix-${{ matrix.name }}*
          retention-days: 7
