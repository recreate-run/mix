name: Validate Development Environment & Run Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pull-requests: write  # Required to comment on PRs
  issues: write         # Required to create/update issue comments

jobs:
  validate:
    name: Validate Dev Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true
          
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep
          
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Air
        run: go install github.com/air-verse/air@latest
        
      - name: Install Project Dependencies
        run: make install-deps
        
      - name: Test Installation
        run: make test-installation

      - name: Create minimum required directories
        run: |
          mkdir -p mix_dev_tool
          mkdir -p mix_agent/build/debug
          
      - name: Run Environment Variable Validation
        run: make test-env

      - name: Run Development Environment Validation
        run: make test-dev-env
        
      - name: Build Backend
        run: |
          cd mix_agent
          go build -o ./build/debug/mix ./main.go

      - name: Run Go Tests
        run: |
          # Use enhanced script with unit-only flag and save output for coverage report
          ./scripts/tests/run_go_tests.sh --unit-only | tee test_output.log

      - name: Generate Coverage Report for PR
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p mix_agent
          echo "## 📊 Mix Agent Test Coverage Report" >> mix_agent/coverage_report.md
          echo "" >> mix_agent/coverage_report.md

          # Extract module coverage from test output
          echo "### Module Coverage:" >> mix_agent/coverage_report.md
          echo "\`\`\`" >> mix_agent/coverage_report.md
          grep "coverage:" test_output.log | grep "mix/internal" | sort >> mix_agent/coverage_report.md
          echo "\`\`\`" >> mix_agent/coverage_report.md
          echo "" >> mix_agent/coverage_report.md

          # Get overall coverage from the script output
          TOTAL_COVERAGE=$(grep "🎯 Total Coverage:" test_output.log | tail -1 | awk '{print $4}' || echo "N/A")
          echo "### Overall Coverage: **$TOTAL_COVERAGE**" >> mix_agent/coverage_report.md

      - name: Upload Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverageReport = fs.readFileSync('mix_agent/coverage_report.md', 'utf8');

            // Find existing coverage comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('📊 Mix Agent Test Coverage Report')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: coverageReport
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: coverageReport
              });
            }

      - name: Start Backend (Background)
        run: |
          cd mix_agent
          ./build/debug/mix --http-port 8088 --dangerously-skip-permissions &
          sleep 5  # Give the backend time to start
          
      - name: Test Backend Health
        run: |
          curl -s http://localhost:8088/health || (echo "Backend health check failed" && exit 1)
          
      - name: Test Connection
        run: |
          make test-connection || true  # Allow this to fail since frontend won't be running
          
      - name: Check Backend Logs
        if: always()  # Run even if previous steps fail
        run: |
          cat dev.log || echo "No logs found"