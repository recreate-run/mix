name: Update API Documentation

on:
  # Run on a schedule (twice per day)
  schedule:
    - cron: '0 0,12 * * *'
  
  # Allow manual triggering of the workflow
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        type: boolean
        default: false

jobs:
  update-api-docs:
    name: Update API Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: |
          cd docs
          bun install
      
      - name: Generate API documentation
        id: generate-api
        continue-on-error: true
        run: |
          cd docs
          echo "Running API generation..."
          bun run generate:api
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
      - name: Check API generation status
        if: steps.generate-api.outputs.status == 'failed'
        run: |
          echo "API generation failed. Check logs for details."
          exit 1
      
      - name: Check for changes
        id: git-check
        run: |
          if git diff --exit-code --quiet docs/lib/mix-api-spec.yaml docs/content/docs/api; then
            echo "No changes detected in API documentation."
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in API documentation."
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Build documentation if changed
        if: steps.git-check.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        id: build-docs
        continue-on-error: true
        run: |
          cd docs
          bun run build
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: (steps.git-check.outputs.changes == 'true' || github.event.inputs.force_update == 'true') && steps.build-docs.outputs.status == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add docs/lib/mix-api-spec.yaml docs/content/docs/api
          
          # Extract API changes summary for commit message
          CHANGES=$(git diff --staged --stat docs/lib/mix-api-spec.yaml | tail -n 1)
          
          git commit -m "chore: update API documentation [automated]
          
          ${CHANGES}
          
          This is an automated commit generated by the GitHub Actions workflow."
          
          git push
          
      - name: Create GitHub issue if generation failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'API Documentation Generation Failed',
              body: `The automated API documentation generation workflow failed on ${new Date().toISOString()}.

              Please check the workflow logs for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              This issue was automatically created by the GitHub Actions workflow.`
            })