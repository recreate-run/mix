name: Update API Documentation

on:
  # Run on a schedule (twice per day)
  schedule:
    - cron: '0 0,12 * * *'
  
  # Allow manual triggering of the workflow
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  update-api-docs:
    name: Update API Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: |
          cd docs
          bun install
      
      - name: Generate API documentation
        id: generate-api
        continue-on-error: true
        run: |
          cd docs
          echo "Running API generation..."
          bun run generate:api
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
      - name: Check API generation status
        if: steps.generate-api.outputs.status == 'failed'
        run: |
          echo "API generation failed. Check logs for details."
          exit 1
      
      - name: Check for changes
        id: git-check
        run: |
          if git diff --exit-code --quiet docs/lib/mix-api-spec.yaml docs/content/docs/api; then
            echo "No changes detected in API documentation."
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in API documentation."
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Build documentation if changed
        if: steps.git-check.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        id: build-docs
        continue-on-error: true
        run: |
          cd docs
          bun run build
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
      - name: Create Pull Request
        if: (steps.git-check.outputs.changes == 'true' || github.event.inputs.force_update == 'true') && steps.build-docs.outputs.status == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update API documentation [automated]"
          title: "chore: update API documentation [automated]"
          body: |
            This PR updates the API documentation based on the latest Speakeasy API spec.
            
            Changes were automatically generated by the API documentation workflow.
          branch: api-docs-update
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            docs/lib/mix-api-spec.yaml
            docs/content/docs/api/**/*
          
      - name: Create GitHub issue if generation failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'API Documentation Generation Failed',
              body: `The automated API documentation generation workflow failed on ${new Date().toISOString()}.

              Please check the workflow logs for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              This issue was automatically created by the GitHub Actions workflow.`
            })