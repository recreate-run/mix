# This file should be placed in: ../mix/.github/workflows/trigger-sdk-generation.yml

name: Trigger SDK Generation

on:
  push:
    branches: [main]
    paths:
      - 'mix_sdk/openapi.json'  # Only trigger when OpenAPI spec changes
  
  # Manual trigger
  workflow_dispatch:

jobs:
  notify-sdk-repo:
    name: Notify SDK Repository
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger SDK Generation
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: recreate-run/mix-typescript-sdk
          event-type: api-spec-updated
          client-payload: |
            {
              "spec_path": "mix_sdk/openapi.json",
              "commit_sha": "${{ github.sha }}",
              "spec_version": "1.0.0"
            }
            
      - name: Notify Success
        run: |
          echo "✅ Successfully triggered SDK generation"
          echo "SDK repo will regenerate TypeScript SDK with latest API changes"