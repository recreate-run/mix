name: Auto PR from Dev to Main

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # Allow manual triggering

# These permissions are needed for the GitHub CLI to create pull requests
permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR from Dev to Main
    runs-on: ubuntu-latest
    # Skip this workflow if the commit message contains [skip-auto-pr]
    if: "!contains(github.event.head_commit.message, '[skip-auto-pr]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper comparison
          
      # GitHub CLI is pre-installed on GitHub Actions runners
        
      - name: Check for existing PRs
        id: check-pr
        run: |
          EXISTING_PR=$(gh pr list --base main --head dev --state open --json number | jq length)
          echo "existing_prs=$EXISTING_PR" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Check for changes
        id: check-changes
        run: |
          git fetch origin main
          CHANGES=$(git log --oneline origin/main..origin/dev | wc -l)
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT

      - name: Create PR if needed
        if: steps.check-pr.outputs.existing_prs == '0' && steps.check-changes.outputs.changes != '0'
        run: |
          # Generate PR title based on commits
          LATEST_COMMIT=$(git log -1 --pretty=%B origin/dev)
          PR_TITLE="[Auto PR] Dev to Main: ${LATEST_COMMIT:0:50}"
          if [ ${#LATEST_COMMIT} -gt 50 ]; then
            PR_TITLE="${PR_TITLE}..."
          fi
          
          # Generate PR body with list of commits
          COMMIT_LIST=$(git log --oneline origin/main..origin/dev | sed 's/^/- /')
          
          # Create the PR
          gh pr create \
            --base main \
            --head dev \
            --title "$PR_TITLE" \
            --body "## Automatic PR from Dev to Main
            
            This PR was automatically generated to merge changes from the dev branch into main.
            
            ### Changes included:
            $COMMIT_LIST
            
            *Generated by GitHub Actions*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}