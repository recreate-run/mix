name: Auto PR from Dev to Main

# This workflow uses the peter-evans/create-pull-request action which can create PRs even without 
# the "Allow GitHub Actions to create and approve pull requests" setting enabled

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # Allow manual triggering

# Basic permissions required for the workflow
permissions:
  contents: write

jobs:
  create-pr:
    name: Create PR from Dev to Main
    runs-on: ubuntu-latest
    # Skip this workflow if the commit message contains [skip-auto-pr]
    if: "!contains(github.event.head_commit.message, '[skip-auto-pr]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper comparison
          ref: dev  # Checkout the dev branch
      
      - name: Extract branch information
        id: branch-info
        run: |
          # Get the latest commit message
          LATEST_COMMIT=$(git log -1 --pretty=%B)
          echo "latest_commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          
          # Check if there are changes between dev and main
          git fetch origin main
          CHANGES=$(git log --oneline origin/main..HEAD | wc -l | xargs)
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          
          # Get list of commits for PR body
          COMMIT_LIST=$(git log --oneline origin/main..HEAD | sed 's/^/- /')
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.branch-info.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Auto PR from Dev to Main
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: auto-pr-dev-to-main
          delete-branch: true
          base: main
          title: "[Auto PR] Dev to Main: ${{ steps.branch-info.outputs.latest_commit }}"
          body: |
            ## Automatic PR from Dev to Main
            
            This PR was automatically generated to merge changes from the dev branch into main.
            
            ### Changes included:
            ${{ steps.branch-info.outputs.commit_list }}
            
            *Generated by GitHub Actions*
          labels: |
            automated pr
            dev-to-main