<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Style Video Animation</title>
    <meta name="description" content="Vertical video with TikTok-style animated text overlay">
    <link rel="stylesheet" href="../shared/base.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

        body {
            background: #000;
            font-family: "Inter", sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .text-overlay {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .animated-text {
            font-weight: 900;
            color: #fff;
            text-shadow:
                3px 3px 0px #000,
                -1px -1px 0px #000,
                1px -1px 0px #000,
                -1px 1px 0px #000,
                6px 6px 20px rgba(0, 0, 0, 0.8);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0.5) rotate(-10deg);
            max-width: 100%;
            width: max-content;
        }

        .char {
            display: inline-block;
            transform-origin: center bottom;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <video class="background-video" id="backgroundVideo" autoplay muted loop style="display: none;">
        </video>

        <div class="text-overlay">
            <div class="animated-text">Let's go!</div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../shared/param-loader.js"></script>
    <script src="../shared/capture-helper.js"></script>
    <script>
        const video = document.getElementById('backgroundVideo');
        const animatedText = document.querySelector('.animated-text');
        let tl;

        /**
         * Parses aspect ratio string like "16/9" into numeric values
         * @param {string} aspectRatioStr - Format like "16/9", "4/3", etc.
         * @returns {Object} Object with width, height, and decimal ratio
         */
        function parseAspectRatio(aspectRatioStr) {
            const parts = aspectRatioStr.split('/');
            if (parts.length !== 2) {
                console.warn(`Invalid aspect ratio format: ${aspectRatioStr}, using default 9/16`);
                return { width: 9, height: 16, decimal: 9 / 16 };
            }

            const width = parseFloat(parts[0]);
            const height = parseFloat(parts[1]);

            if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
                console.warn(`Invalid aspect ratio values: ${aspectRatioStr}, using default 9/16`);
                return { width: 9, height: 16, decimal: 9 / 16 };
            }

            return { width, height, decimal: width / height };
        }

        async function getParams() {
            return await window.AnimationParams.loadParameters();
        }

        function applyParams(params) {
            // Apply text parameters
            animatedText.textContent = params.overlayText;
            animatedText.style.fontSize = `${params.textSizeRem}rem`;
            animatedText.style.color = params.textColor;

            const baseShadow = '3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000';
            const dropShadow = `6px 6px ${20 * params.textShadowIntensityMultiplier}px rgba(0,0,0,${0.8 * params.textShadowIntensityMultiplier})`;
            animatedText.style.textShadow = `${baseShadow}, ${dropShadow}`;

            // Apply dynamic aspect ratio
            const aspectRatio = parseAspectRatio(params.aspectRatio);
            const pageContainer = document.querySelector('.page-container');

            // Set aspect ratio and responsive constraints on container
            pageContainer.style.aspectRatio = `${aspectRatio.width}/${aspectRatio.height}`;
            pageContainer.style.maxWidth = `calc(100vh * ${aspectRatio.width}/${aspectRatio.height})`;
            pageContainer.style.maxHeight = `calc(100vw * ${aspectRatio.height}/${aspectRatio.width})`;

            // Apply background to page-container
            pageContainer.style.background = params.backgroundCSS || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';

            // Handle background video
            if (params.backgroundVideoUrl && params.backgroundVideoUrl.trim() !== '') {
                video.src = params.backgroundVideoUrl;
                video.style.display = 'block';

                // Add error handling
                video.onerror = function(e) {
                    video.style.display = 'none';
                    pageContainer.style.background = params.backgroundCSS || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                };

                // Set background to transparent when video is used
                pageContainer.style.background = 'transparent';
            } else {
                video.style.display = 'none';
            }
        }

        // Split text into characters with each word on separate line
        function splitTextIntoChars() {
            const text = animatedText.textContent;
            animatedText.innerHTML = '';

            const words = text.split(' ');

            words.forEach((word, wordIndex) => {
                word.split('').forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char;
                    animatedText.appendChild(span);
                });

                if (wordIndex < words.length - 1) {
                    animatedText.appendChild(document.createElement('br'));
                }
            });
        }

        function createTimeline(params) {
            if (tl) tl.kill();

            tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });

            // Start video at beginning of timeline
            tl.call(() => {
                video.currentTime = 0;
                video.play().catch(console.error);
            }, [], 0);

            const chars = document.querySelectorAll('.char');

            gsap.set(animatedText, { opacity: 0 });
            gsap.set(chars, { y: 100, rotationX: -90, opacity: 0 });

            tl.to(animatedText, {
                opacity: 1,
                scale: 1,
                rotation: 0,
                duration: 0.4,
                ease: "back.out(2)"
            }, 0)
                .to(chars, {
                    y: 0,
                    rotationX: 0,
                    opacity: 1,
                    duration: 0.6,
                    stagger: params.characterAnimationDelaySeconds,
                    ease: "back.out(1.2)"
                }, 0)
                .to(chars, {
                    y: -params.characterBounceHeightPixels,
                    duration: 0.3,
                    stagger: params.characterAnimationDelaySeconds * 0.6,
                    ease: "power2.out"
                })
                .to(chars, {
                    y: 0,
                    duration: 0.4,
                    stagger: params.characterAnimationDelaySeconds * 0.6,
                    ease: "bounce.out"
                })
                .to(animatedText, {
                    scale: params.maxPulseScaleFactor,
                    duration: 0.2,
                    yoyo: true,
                    repeat: 1,
                    ease: "power2.inOut"
                })
                .to(animatedText, {
                    scale: 1.05,
                    duration: 0.3,
                    ease: "power2.out"
                });

            // Stop video when animation actually completes
            tl.call(() => {
                video.pause();
            });

            return tl;
        }

        async function initAnimation() {
            const params = await getParams();
            window.currentParams = params;
            applyParams(params);
            splitTextIntoChars();
            createTimeline(params);

            // Start animation (video controlled by timeline callbacks)
            tl.play();
        }


        // Initialize
        document.addEventListener('DOMContentLoaded', initAnimation);


        // Handle video loading
        video.addEventListener('loadeddata', () => {
            console.log('Video loaded successfully');
        });

        video.addEventListener('error', (e) => {
            console.error('Video failed to load:', e);
        });


        // Expose for capture script compatibility with video sync
        window.__CAPTURE__ = window.CaptureHelper.createCustomCaptureInterface({
            duration: () => {
                return window.currentParams ? window.currentParams.totalAnimationDurationSeconds : 3;
            },
            initAnimation: () => {
                const params = window.currentParams;
                if (!params) {
                    console.error('Parameters not loaded. Make sure animation is initialized first.');
                    return null;
                }

                applyParams(params);
                splitTextIntoChars();

                video.pause();
                video.currentTime = 0;

                const timeline = createTimeline(params);
                window.tl = timeline;
                return timeline;
            },
            setFrameLogic: async (frameIndex, fps, time, progress, timeline) => {
                // Sync timeline progress
                timeline.progress(progress);

                // Sync video currentTime and wait for seek to complete
                video.currentTime = time;

                // Wait for video to seek to the exact frame
                await new Promise(resolve => {
                    const onSeeked = () => {
                        video.removeEventListener('seeked', onSeeked);
                        resolve();
                    };
                    video.addEventListener('seeked', onSeeked);

                    // Fallback timeout to prevent hanging
                    setTimeout(resolve, 100);
                });
            }
        });
    </script>
</body>

</html>
