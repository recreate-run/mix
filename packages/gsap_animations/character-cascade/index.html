<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Slide & Flip Animation Preview</title>
    <link rel="stylesheet" href="/shared/base.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            background: radial-gradient(circle at 30% 40%, rgba(0, 255, 136, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 0, 136, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(0, 136, 255, 0.1) 0%, transparent 50%),
                        #0a0a0a;
            font-family: "Inter", sans-serif;
        }

        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        .text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            perspective: 1000px;
            max-width: 90vw;
        }

        .text {
            font-family: "Inter", sans-serif;
            font-weight: 800;
            font-size: clamp(48px, 12vw, 180px);
            color: #ffffff;
            text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff8840, 0 4px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.02em;
            line-height: 0.9;
            text-transform: uppercase;
        }

        .char {
            display: inline-block;
            position: relative;
        }

    </style>
</head>
<body>
    <div class="particles-container" id="particlesContainer"></div>
    
    <div class="text-container">
        <div class="text">CREATIVE CODING</div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js"></script>
    <script>
        let timeline;
        let particles = [];
        let DURATION = 3;
        let split;

        function getParams() {
            const defaults = {
                displayText: 'CREATIVE CODING',
                totalAnimationDurationSeconds: 3,
                textSizeCSS: 'clamp(48px, 12vw, 180px)',
                primaryTextColor: '#ffffff',
                textGlowShadowColor: '#00ff88',
                slideInDistancePixels: 400,
                characterFlipDelaySeconds: 0.12,
                floatingParticleCount: 40,
                backgroundGradientCSS: 'radial-gradient(circle at 30% 40%, rgba(0, 255, 136, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 0, 136, 0.1) 0%, transparent 50%), radial-gradient(circle at 40% 80%, rgba(0, 136, 255, 0.1) 0%, transparent 50%), #0a0a0a',
                autoloop: false
            };
            
            const urlParams = new URLSearchParams(location.search);
            const urlObj = Object.fromEntries(urlParams);
            
            // Convert string numbers to actual numbers
            ['totalAnimationDurationSeconds', 'slideInDistancePixels', 'characterFlipDelaySeconds', 'floatingParticleCount'].forEach(key => {
                if (urlObj[key]) urlObj[key] = parseFloat(urlObj[key]);
            });
            
            // Convert boolean parameters
            if (urlObj.autoloop !== undefined) {
                urlObj.autoloop = urlObj.autoloop === 'true';
            }
            
            return { ...defaults, ...urlObj };
        }

        function applyParams(params) {
            DURATION = params.totalAnimationDurationSeconds;
            
            // Apply text content
            document.querySelector('.text').textContent = params.displayText;
            
            // Apply styles
            const textElement = document.querySelector('.text');
            textElement.style.fontSize = params.textSizeCSS;
            textElement.style.color = params.primaryTextColor;
            textElement.style.textShadow = `0 0 20px ${params.textGlowShadowColor}, 0 0 40px ${params.textGlowShadowColor}40, 0 4px 8px rgba(0, 0, 0, 0.5)`;
            
            // Apply background
            document.body.style.background = params.backgroundGradientCSS;
        }
        
        function createParticles(particleCount = 40) {
            const container = document.getElementById('particlesContainer');
            // Clear existing particles
            container.innerHTML = '';
            particles = [];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 1;
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const opacity = Math.random() * 0.3 + 0.1;
                
                gsap.set(particle, {
                    width: size,
                    height: size,
                    x: x,
                    y: y,
                    opacity: opacity
                });
                
                container.appendChild(particle);
                particles.push({
                    element: particle,
                    baseX: x,
                    baseY: y,
                    baseOpacity: opacity,
                    speed: Math.random() * 0.5 + 0.3
                });
            }
        }
        
        function updateParticles(time) {
            particles.forEach((particle, index) => {
                const t = time + index * 0.1;
                const floatY = particle.baseY + Math.sin(t * particle.speed) * 20;
                const floatX = particle.baseX + Math.cos(t * particle.speed * 0.7) * 15;
                
                gsap.set(particle.element, {
                    x: floatX,
                    y: floatY,
                    opacity: particle.baseOpacity
                });
            });
        }
        
        
        function createAnimation(params) {
            // Initialize particles
            createParticles(params.floatingParticleCount);
            
            // Split text into characters
            if (split) split.revert();
            split = new SplitText('.text', { type: 'chars', charsClass: 'char' });
            
            // Kill existing timeline
            if (timeline) timeline.kill();
            
            // Create timeline with infinite repeat
            timeline = gsap.timeline({ 
                repeat: -1,
                repeatDelay: 1,
                onUpdate: function() {
                    updateParticles(this.time());
                }
            });
            
            // Phase 1: Slide in from left
            timeline.from('.text', {
                x: -params.slideInDistancePixels,
                duration: 1,
                ease: "power3.out"
            });
            
            // Phase 2: Character flip and fade out sequence
            timeline.to(split.chars, {
                rotationY: 90,
                opacity: 0,
                y: -50,
                duration: 0.8,
                stagger: params.characterFlipDelaySeconds,
                ease: "power2.in"
            }, 1);
            
            // Auto-start animation
            timeline.play();
            
            return timeline;
        }
        
        function initAnimation() {
            const params = getParams();
            window.currentParams = params;
            applyParams(params);
            createAnimation(params);
        }

        
        // Initialize
        window.addEventListener('load', initAnimation);

        // Expose for capture script compatibility
        window.__CAPTURE__ = {
            duration: DURATION,
            timeline: null,
            
            init() {
                this.timeline = createAnimation();
            },
            
            setFrame(frameIndex, fps) {
                const time = frameIndex / fps;
                this.timeline.progress(time / this.duration);
            },
            
            getTotalFrames(fps) {
                return Math.round(this.duration * fps);
            }
        };
    </script>
</body>
</html>
