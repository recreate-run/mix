<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remotion Animation Replica</title>
    <link rel="stylesheet" href="../shared/base.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap");

        body {
            background-color: #d1fae5;
            font-family: 'Urbanist', sans-serif;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d1fae5;
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            transform-origin: center center;
        }

        .blob-1 {
            background-color: #84fab0;
        }

        .blob-2 {
            background-color: #8fd3f4;
        }

        .blob-3 {
            background-color: #fbc2eb;
        }

        .blob-4 {
            background-color: #7dd3fc;
        }

        .title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        .title {
            font-family: 'Urbanist', sans-serif;
            font-weight: 700;
            font-size: 3rem;
            color: #111;
            margin: 0;
            max-width: 900px;
            line-height: 1.2;
            word-wrap: break-word;
            white-space: normal;
        }

        .word {
            display: inline-block;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="">
        <div class="background">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
        </div>

        <div class="title-container">
            <h1 class="title" id="titleText">Meet Mix: Your local multimodal agent</h1>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js"></script>
    <script src="../shared/param-loader.js"></script>
    <script src="../shared/capture-helper.js"></script>
    <script>
        const blobs = document.querySelectorAll('.blob');
        let masterTimeline;
        let st;
        let blobAnimations = [];
        let DURATION = 3;

        async function getParams() {
            return await window.AnimationParams.loadParameters();
        }

        function applyParams(params) {
            DURATION = params.animationDurationSeconds;

            // Apply text
            document.getElementById('titleText').textContent = params.displayText;

            // Apply styles
            document.querySelector('.title').style.fontSize = `${params.textSizeRem}rem`;
            document.querySelector('.title').style.color = params.textColor;
            document.querySelector('.background').style.backgroundColor = params.canvasBackgroundColor;
            document.body.style.backgroundColor = params.canvasBackgroundColor;

            // Apply blob colors and styles
            document.querySelector('.blob-1').style.backgroundColor = params.primaryBlobColor;
            document.querySelector('.blob-2').style.backgroundColor = params.secondaryBlobColor;
            document.querySelector('.blob-3').style.backgroundColor = params.tertiaryBlobColor;
            document.querySelector('.blob-4').style.backgroundColor = params.quaternaryBlobColor;

            blobs.forEach(blob => {
                blob.style.opacity = params.blobOpacityLevel;
                blob.style.filter = `blur(${params.blobBlurRadiusPixels}px)`;
            });
        }

        function initializeSplitText() {
            if (st) st.revert();
            st = new SplitText('#titleText', { type: 'words', wordsClass: 'word' });
        }

        function createBlobAnimation(blobElement, seed) {
            const tl = gsap.timeline();

            // Seed-based randomness for consistent but unique patterns per blob
            const seededRandom = (offset = 0) => {
                const x = Math.sin((seed + offset) * 12.9898) * 43758.5453123;
                return x - Math.floor(x);
            };

            // Use dynamic duration
            const totalDuration = DURATION;
            const easingOptions = ["power2.inOut", "power3.inOut", "sine.inOut"]; // Only smooth easing options
            const blobEasing = easingOptions[Math.floor(seededRandom(2) * easingOptions.length)];

            // Generate random waypoints for smooth movement
            function getRandomPosition(waypointIndex) {
                const padding = 100;
                const blobSize = 400; // Blob width/height
                const radiusVariation = seededRandom(waypointIndex * 10) * 200 + 300; // Variable movement radius
                const angle = seededRandom(waypointIndex * 15) * Math.PI * 2;

                // Use actual viewport dimensions
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const centerX = screenWidth / 2 - blobSize / 2; // Actual screen center minus blob center offset
                const centerY = screenHeight / 2 - blobSize / 2;

                return {
                    x: Math.max(padding - blobSize / 2, Math.min(screenWidth - padding - blobSize / 2,
                        centerX + Math.cos(angle) * radiusVariation)),
                    y: Math.max(padding - blobSize / 2, Math.min(screenHeight - padding - blobSize / 2,
                        centerY + Math.sin(angle) * radiusVariation))
                };
            }

            // Create fewer waypoints for smoother movement within 3 seconds
            const numWaypoints = 2 + Math.floor(seededRandom(3) * 2); // 2-3 waypoints per blob
            const waypoints = [];

            for (let i = 0; i < numWaypoints; i++) {
                waypoints.push(getRandomPosition(i));
            }

            // Calculate timing to fit exactly within 3 seconds
            const initialDelay = seededRandom(4) * 0.3; // Small initial stagger (0-0.3s)
            const availableTime = totalDuration - initialDelay;
            const baseSegmentDuration = availableTime / numWaypoints;

            // Animate through waypoints with smooth timing within 3 second limit
            waypoints.forEach((waypoint, index) => {
                const segmentDuration = baseSegmentDuration * (0.8 + seededRandom(index * 5) * 0.4); // 0.8-1.2x base duration
                const randomRotation = (seededRandom(index * 7) - 0.5) * 180 * (seed * 0.3); // Moderate rotation
                const randomScale = 0.85 + seededRandom(index * 8) * 0.3; // Scale 0.85-1.15 

                tl.to(blobElement, {
                    duration: segmentDuration,
                    x: waypoint.x,
                    y: waypoint.y,
                    rotation: randomRotation,
                    scale: randomScale,
                    ease: blobEasing,
                    delay: index === 0 ? initialDelay : 0
                });
            });

            return tl;
        }

        function createTitleAnimation() {
            const tl = gsap.timeline();

            // Title animation: word-by-word typing with 150ms delay
            tl.to(st.words, {
                opacity: 1,
                duration: 0.1,
                stagger: 0.15, // 150ms delay between words
                ease: "none"
            }, 0); // Start at 0 seconds

            // Fade out after 2.5 seconds to keep text visible longer
            tl.to(st.words, {
                opacity: 0,
                duration: 0.5,
                ease: "power2.inOut"
            }, 2.5);

            return tl;
        }

        function init() {
            // Initialize split text
            initializeSplitText();

            // Create master timeline with conditional repeat
            const params = window.currentParams || { autoloop: false };
            masterTimeline = gsap.timeline({
                repeat: params.autoloop ? -1 : 0,
                repeatDelay: params.autoloop ? 1 : 0
            });

            // Create blob animations (each blob gets a different seed)
            blobs.forEach((blob, index) => {
                const seed = index + 1;
                const blobTl = createBlobAnimation(blob, seed);
                blobAnimations.push(blobTl);
                masterTimeline.add(blobTl, 0);
            });

            // Add title animation
            const titleTl = createTitleAnimation();
            masterTimeline.add(titleTl, 0);

            // Set initial positions for blobs
            blobs.forEach((blob, index) => {
                const blobSize = 400;
                const centerX = window.innerWidth / 2 - blobSize / 2;
                const centerY = window.innerHeight / 2 - blobSize / 2;
                gsap.set(blob, { x: centerX, y: centerY }); // Actual screen center position
            });

            // Force timeline to have minimum duration
            if (masterTimeline.duration() < DURATION) {
                masterTimeline.duration(DURATION);
            }

            // Auto-start animation
            masterTimeline.play();
        }

        async function initAnimation() {
            const params = await getParams();
            window.currentParams = params;
            applyParams(params);
            init();
        }


        // Initialize on load
        window.addEventListener('load', initAnimation);

        // Expose for capture script compatibility
        window.__CAPTURE__ = window.CaptureHelper.createCustomCaptureInterface({
            duration: async () => {
                const params = await getParams();
                return params.animationDurationSeconds;
            },
            initAnimation: async () => {
                const params = await getParams();
                applyParams(params);
                init();
                return masterTimeline;
            },
            setFrameLogic: async (frameIndex, fps, time, progress, timeline) => {
                // Standard timeline progress sync
                timeline.progress(progress);
            }
        });
    </script>
</body>

</html>
